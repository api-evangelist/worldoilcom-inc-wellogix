name: WorldOil.com, Inc./Wellogix
description: Wellogix (originally incorporated as WorldOil.com, Inc.) was a Houston,
  Texas software company serving the upstream oil and gas industry, backed by Battery
  Ventures. Its hosted tools - including WorkFlowNavigator, DynaMaps, DrillTeam, and
  FieldTeam - helped drilling engineers plan wells and let operators and service companies
  collaborate on and procure complex engineered services, exchanging enterprise data
  across companies. The company is no longer active as an operating software vendor;
  wellogix.com still has DNS registered but no responding web server, and no public
  API, developer portal, SDKs, or package registry artifacts were found. Note the
  worldoil.com domain today belongs to Gulf Publishing's World Oil magazine, a separate,
  unrelated business.
